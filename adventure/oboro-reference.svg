<?xml version="1.0" encoding="UTF-8"?>
<!--
  朧 (Oboro) — リファレンスアートワーク
  ghost シェイプ。アプリ内ではインライン SVG として描画されている
  ものを、色・寸法をインライン化した単体ファイルに書き出したもの。
  2D-HD アセット制作 / AI 生成のリファレンス用途。
  座標系: viewBox 128 x 140 / 静止ポーズ（アニメーションは除外）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 140" width="256" height="280">
  <!-- per-user カラーの淡いオーラ（背景）。本来はユーザーの actor-color 変数。
       ここでは代表色 常磐 #1f6f4a を opacity 0.26 で配置 -->
  <ellipse cx="62" cy="78" rx="52" ry="54" fill="#1f6f4a" opacity="0.26"/>

  <!-- 腕のこぶ（body より先に描いて付け根が body の裏に隠れる） -->
  <path d="M18 86 q-12 2 -16 9 q9 1 17 -2 Z" fill="#fcfbf9" stroke="#43332b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M110 86 q12 2 16 9 q-9 1 -17 -2 Z" fill="#fcfbf9" stroke="#43332b" stroke-width="5" stroke-linejoin="round"/>

  <!-- 本体: 白 #fcfbf9 + ダークライン #43332b。裾は波打つ tail-curl -->
  <path d="M64 14 C40 14 18 32 17 60 C16 74 16 86 19 98 C21 107 24 116 31 116 C37 116 39 108 45 108 C51 108 53 118 60 118 C66 118 68 107 75 109 C90 113 104 120 116 108 C124 100 121 86 112 88 C106 89 106 96 100 94 C109 86 113 73 112 60 C110 32 88 14 64 14 Z"
    fill="#fcfbf9" stroke="#43332b" stroke-width="6" stroke-linejoin="round"/>

  <!-- 目（縦長の楕円） -->
  <ellipse cx="48" cy="64" rx="5.2" ry="7.4" fill="#2a2036"/>
  <ellipse cx="78" cy="64" rx="5.2" ry="7.4" fill="#2a2036"/>

  <!-- 口（やわらかな波線） -->
  <path d="M52 80 q4 -6 8 0 t8 0" fill="none" stroke="#2a2036" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 魔女帽（右肩に少し傾けて被る / rotate 20deg） -->
  <g transform="rotate(20 96 30)">
    <path d="M80 40 h36 v5 h-36 Z" fill="#4a3326" stroke="#33231a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M88 14 h20 v26 h-20 Z" fill="#5b3e2c" stroke="#33231a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="88" y="33" width="20" height="4" fill="#33231a"/>
  </g>
</svg>
