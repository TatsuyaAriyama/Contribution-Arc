<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- リンク遷移 / リロードで画面が拡大されてズレるとの報告。
         原因は (a) iOS Safari の "入力フォーカスでオートズーム" の状態が
         次のページに引き継がれる、(b) ブラウザ側のテキストサイズ自動拡大、
         の 2 つ。pinch zoom 自体は本アプリでは設定 (UI scale) で
         調整する方針なので maximum-scale=1.0 で固定する。
         前回 touch-action / overscroll-behavior を一緒に入れたら
         スワイプ系が壊れたので、それらは触らずに必要最小限の修正のみ。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Contribution Arc is a learning and contribution record service for developers."
    />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Contribution Arc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
    <title>Contribution Arc | Learning & Contribution Records</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("contribution-arc-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          // Force the active theme-color meta to match the stored
          // preference immediately, regardless of system color scheme,
          // so the iOS status bar tint doesn't flicker between system
          // and stored on first paint.
          var dark = document.querySelector('meta[name="theme-color"][media*="dark"]');
          var light = document.querySelector('meta[name="theme-color"][media*="light"]');
          if (dark) dark.setAttribute("content", theme === "dark" ? "#0f0f10" : "#fafaf8");
          if (light) light.setAttribute("content", theme === "dark" ? "#0f0f10" : "#fafaf8");
        } catch (e) {}
      })();
    </script>
    <!--
      Inline splash screen (起動時のローディング)
      JS バンドルがロードされる前に DOM だけで表示する。React mount 後に
      main.tsx 側で `data-state="hide"` を立て、300-500ms のフェードアウト
      ののち DOM から remove する。
      テーマは `<html data-theme="...">` (上のブロックで設定済み) に追従。
    -->
    <style>
      /* nondo インスパイアのオリジナル splash。
         「純黒 / 純白の 1.5px ink hairline + 太字ロゴ + 呼吸する 3 つの dot」
         構成。緑グラデや SVG リーフは廃止し、極ミニマルな chrome に統一。
         主要トークン:
           - bg / fg: 純黒/純白で flip
           - logo: extrabold 32px、字間 -0.045em
           - hairline frame: 1.5px、角丸 22px
           - 3 dots: 6px、順番に opacity 0.2 → 1 を 1.4s ループ */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
          "ヒラギノ角ゴ ProN W3", "Yu Gothic UI", "Yu Gothic", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: auto;
      }
      html[data-theme="light"] #app-splash {
        background: #ffffff;
        color: #1a1817;
      }
      #app-splash[data-state="hide"] {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 30px 28px 24px;
        min-width: 240px;
        max-width: 320px;
        text-align: center;
        border: 1.5px solid #ffffff;
        border-radius: 22px;
        background: #000000;
        animation: app-splash-fade-in 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme="light"] .app-splash-inner {
        border-color: #1a1817;
        background: #ffffff;
      }
      .app-splash-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border: 1.5px solid currentColor;
        border-radius: 16px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .app-splash-title {
        margin: 0;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .app-splash-subtitle {
        margin: 0;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.18em;
        opacity: 0.5;
        text-transform: uppercase;
      }
      .app-splash-dots {
        display: inline-flex;
        gap: 8px;
        margin-top: 2px;
      }
      .app-splash-dots > span {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.2;
        animation: app-splash-dot 1.4s ease-in-out infinite;
      }
      .app-splash-dots > span:nth-child(2) { animation-delay: 0.18s; }
      .app-splash-dots > span:nth-child(3) { animation-delay: 0.36s; }

      @keyframes app-splash-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes app-splash-dot {
        0%, 100% { opacity: 0.2; transform: translateY(0); }
        50%      { opacity: 1;   transform: translateY(-2px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        .app-splash-inner,
        .app-splash-dots > span {
          animation: none !important;
          transition: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash: JS バンドルロード前 / 後初期 render 中 / 認証チェック中まで
         表示。React mount 後に main.tsx が data-state="hide" を立てて
         フェードアウト → DOM remove する。 -->
    <div id="app-splash" role="status" aria-label="読み込み中">
      <div class="app-splash-inner">
        <div class="app-splash-mark" aria-hidden="true">A</div>
        <h1 class="app-splash-title">Contribution Arc</h1>
        <p class="app-splash-subtitle">Loading</p>
        <div class="app-splash-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
